# Продакшен: docker compose up -d --build   (инструкция — docs/DEPLOY.md)
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "true" # cookie только по HTTPS
    volumes:
      - ./data:/app/data # база, профиль, резюме — переживают пересборку

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # сертификаты Let's Encrypt
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
